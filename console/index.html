<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AB1202 R console</title><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon-192.png">
<style>
:root{--navy:#181C62;--red:#C8102E;--bg:#ffffff;--fg:#1d1d1f;--muted:#5c5f73;--line:#d9dceb;--code:#f6f7fb}
@media (prefers-color-scheme: dark){:root{--bg:#12142e;--fg:#eef0ff;--muted:#aeb3d6;--line:#2c3060;--code:#1b1e44}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header a{color:#fff} main{max-width:980px;margin:0 auto;padding:16px}
textarea{width:100%;box-sizing:border-box;min-height:180px;font:15px/1.45 Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--code);color:var(--fg)}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:15px;cursor:pointer} button:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:80px;font:14px/1.45 Menlo,Consolas,monospace}
.err{color:#d93a4a} #status{color:var(--muted)} .row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
</style></head><body>
<header><strong>AB1202 R console</strong><span id="status">Starting R…</span><a href="../index.html">All weeks</a></header>
<main>
<p>Base R, running inside this page: nothing to install, and no internet needed once the app is on your device. The course data are ready: <code>hotels &lt;- read.csv("hotels.csv")</code>.</p>
<textarea id="code" spellcheck="false" aria-label="R code">hotels &lt;- read.csv("hotels.csv")
dim(hotels)</textarea>
<div class="row"><button id="run" disabled>Run (Ctrl+Enter)</button><button id="clear" style="background:#5c5f73">Clear output</button></div>
<pre id="out" aria-live="polite"></pre>
</main>
<script type="module">
import { WebR } from "../webr/webr.mjs";
const $ = (id) => document.getElementById(id);
const webR = new WebR({ baseUrl: "../webr/" });
await webR.init();
const data = await (await fetch("../data/hotels.csv.gz")).arrayBuffer();
await webR.FS.writeFile("/home/web_user/hotels.csv", new Uint8Array(data));
const shelter = await new webR.Shelter();
$("status").textContent = "R is ready"; $("run").disabled = false;
async function run() {
  $("run").disabled = true; $("status").textContent = "Running…";
  try {
    const res = await shelter.captureR($("code").value, { withAutoprint: true, captureStreams: true, captureConditions: false });
    for (const o of res.output) {
      const line = document.createElement("span"); line.textContent = o.data + "\n";
      if (o.type === "stderr") line.className = "err"; $("out").appendChild(line);
    }
    shelter.purge();
  } catch (e) { const line = document.createElement("span"); line.className = "err"; line.textContent = String(e.message || e) + "\n"; $("out").appendChild(line); }
  $("run").disabled = false; $("status").textContent = "R is ready"; $("out").scrollTop = $("out").scrollHeight;
}
$("run").onclick = run; $("clear").onclick = () => { $("out").textContent = ""; };
$("code").addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); } });
</script></body></html>
